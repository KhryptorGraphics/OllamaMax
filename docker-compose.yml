version: '3.8'

services:
  # OllamaMax API Server with Authentication
  ollamamax-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "13100:13100"  # API server port
      - "3000:3000"    # Web interface port
    environment:
      - NODE_ENV=production
      - PORT=13100
      - API_PORT=13100
      - WEB_PORT=3000
      # SECURITY: JWT_SECRET must be set via environment variable (no default)
      - JWT_SECRET=${JWT_SECRET}
      - SQLITE_DB_PATH=/app/data/users.db
      # Redis Configuration
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-ollama_redis_pass}
      # Email Configuration - SECURITY: SMTP_PASSWORD must be set via environment variable
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-noreply@giggatek.com}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM:-noreply@giggatek.com}
      # Database Configuration (PostgreSQL for production)
      - DB_TYPE=${DB_TYPE:-sqlite}  # sqlite or postgres
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-ollamamax}
      - POSTGRES_USER=${POSTGRES_USER:-ollama}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secure_password}
      # Tracing Configuration
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ollama_data:/app/data
      - ollama_logs:/app/logs
      - ollama_uploads:/app/uploads
      - ollama_models:/app/models
    networks:
      - ollama_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:13100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Web Interface (served by API server, but can be separate)
  ollamamax-web:
    build:
      context: .
      dockerfile: web.Dockerfile
    ports:
      - "8080:8080"   # Separate web server port
    environment:
      - API_BASE_URL=http://ollamamax-api:13100
      - WEB_PORT=8080
    depends_on:
      - ollamamax-api
    volumes:
      - ./web-interface:/app/web
    networks:
      - ollama_network
    restart: unless-stopped

  # PostgreSQL Database for Authentication and User Data
  postgres:
    image: postgres:15-alpine
    # SECURITY: Removed external port exposure - use Docker network only (ISSUE-003)
    expose:
      - "5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-ollamamax}
      - POSTGRES_USER=${POSTGRES_USER:-ollama}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secure_password}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - ollama_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ollama} -d ${POSTGRES_DB:-ollamamax}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Session Management and Caching
  redis:
    image: redis:7-alpine
    # SECURITY: Removed external port exposure - use Docker network only (ISSUE-003)
    expose:
      - "6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-ollama_redis_pass}
    volumes:
      - redis_data:/data
    networks:
      - ollama_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Nginx Reverse Proxy and Load Balancer
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"       # HTTP
      - "443:443"     # HTTPS
    volumes:
      - ./nginx/nginx-production.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - ollamamax-api
      - ollamamax-web
    networks:
      - ollama_network
    restart: unless-stopped

  # Email Service (MailCatcher for development/testing)
  mailcatcher:
    image: sj26/mailcatcher:latest
    ports:
      - "1080:1080"   # Web interface
      - "1025:1025"   # SMTP
    networks:
      - ollama_network
    restart: unless-stopped

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
      - '--web.listen-address=0.0.0.0:9090'
    networks:
      - ollama_network
    restart: unless-stopped

  # Grafana Analytics Dashboard
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"   # Changed to avoid conflict with web interface
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin_password}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - ollama_network
    restart: unless-stopped

  # Jaeger Distributed Tracing (All-in-One)
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "5775:5775/udp"   # Accept zipkin.thrift over compact thrift protocol
      - "6831:6831/udp"   # Accept jaeger.thrift over compact thrift protocol
      - "6832:6832/udp"   # Accept jaeger.thrift over binary thrift protocol
      - "5778:5778"       # Serve configs
      - "16686:16686"     # Serve frontend
      - "14268:14268"     # Accept jaeger.thrift directly from clients
      - "14250:14250"     # Accept model.proto
      - "9411:9411"       # Zipkin compatible endpoint
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    networks:
      - ollama_network
    restart: unless-stopped

  # Elasticsearch for Log Storage
  elasticsearch:
    image: elasticsearch:8.11.0
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - ollama_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Logstash for Log Processing
  logstash:
    image: logstash:8.11.0
    ports:
      - "5044:5044"       # Beats input
      - "9600:9600"       # Logstash monitoring API
    volumes:
      - ./monitoring/logstash/pipeline:/usr/share/logstash/pipeline:ro
    environment:
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - ollama_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9600/_node/stats"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Kibana for Log Visualization
  kibana:
    image: kibana:8.11.0
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - ollama_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Filebeat for Log Collection
  filebeat:
    image: elastic/filebeat:8.11.0
    user: root
    volumes:
      - ./monitoring/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - LOGSTASH_HOST=logstash
      - LOGSTASH_PORT=5044
      - ENVIRONMENT=production
    depends_on:
      - logstash
    networks:
      - ollama_network
    restart: unless-stopped

  # Ollama Primary Node
  ollama-primary:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - ollama_network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Ollama Worker Node 1
  ollama-worker-1:
    image: ollama/ollama:latest
    ports:
      - "11435:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    volumes:
      - ollama_models_worker1:/root/.ollama
    networks:
      - ollama_network
    restart: unless-stopped

  # Ollama Worker Node 2
  ollama-worker-2:
    image: ollama/ollama:latest
    ports:
      - "11436:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    volumes:
      - ollama_models_worker2:/root/.ollama
    networks:
      - ollama_network
    restart: unless-stopped

volumes:
  # Application Data
  ollama_data:
    driver: local
  ollama_logs:
    driver: local
  ollama_uploads:
    driver: local
  ollama_models:
    driver: local
  ollama_models_worker1:
    driver: local
  ollama_models_worker2:
    driver: local

  # Database Data
  postgres_data:
    driver: local
  redis_data:
    driver: local

  # Monitoring Data
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  elasticsearch_data:
    driver: local

  # Logs
  nginx_logs:
    driver: local

networks:
  ollama_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
