version: '3.8'

services:
  ollamamax:
    build: .
    ports:
      - "11434:11434"  # API port (above 11111 as requested)
      - "11435:11435"  # P2P communication port
      - "11436:11436"  # Admin dashboard port
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_PORT=11434
      - DB_HOST=postgres
      - DB_PORT=15432
      - DB_NAME=ollamamax
      - DB_USER=ollama
      - DB_PASSWORD=secure_password
      - DB_SSL_MODE=prefer
      - REDIS_HOST=redis
      - REDIS_PORT=16379
      - REDIS_PASSWORD=secure_redis_password
      - JWT_SECRET_KEY=your-secret-key-change-this-in-production
      - AUTH_ENABLED=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ollama_models:/app/models
      - ollama_logs:/app/logs
    networks:
      - ollama_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:11434/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    ports:
      - "15432:15432"  # Postgres port (above 10000)
    environment:
      - POSTGRES_DB=ollamamax
      - POSTGRES_USER=ollama
      - POSTGRES_PASSWORD=secure_password
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
      - PGPORT=15432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ollama_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ollama -d ollamamax -p 15432"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "16379:16379"  # Redis port (above 10000)
    command: redis-server --port 16379 --appendonly yes --requirepass secure_redis_password
    volumes:
      - redis_data:/data
    networks:
      - ollama_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "16379", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "10080:10080"   # HTTP port (above 10000)
      - "10443:10443"  # HTTPS port (above 10000)
    environment:
      - NGINX_PORT=10080
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - ollamamax
    networks:
      - ollama_network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "19090:19090"  # Prometheus port (above 10000)
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
      - '--web.listen-address=0.0.0.0:19090'
    networks:
      - ollama_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "13000:13000"  # Grafana port (above 10000)
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin_password
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_HTTP_PORT=13000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - ollama_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  ollama_models:
  ollama_logs:
  nginx_logs:
  prometheus_data:
  grafana_data:

networks:
  ollama_network:
    driver: bridge