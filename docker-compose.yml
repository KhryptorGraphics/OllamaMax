version: '3.8'

services:
  # OllamaMax API Server with Authentication
  ollamamax-api:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "13100:13100"  # API server port
      - "3000:3000"    # Web interface port
    environment:
      - NODE_ENV=production
      - PORT=13100
      - API_PORT=13100
      - WEB_PORT=3000
      - JWT_SECRET=${JWT_SECRET:-ollamamax_production_jwt_secret_change_me}
      - SQLITE_DB_PATH=/app/data/users.db
      # Redis Configuration
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-ollama_redis_pass}
      # Email Configuration
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-noreply@giggatek.com}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-teamrsi123teamrsi123}
      - SMTP_FROM=${SMTP_FROM:-noreply@giggatek.com}
      # Database Configuration (PostgreSQL for production)
      - DB_TYPE=${DB_TYPE:-sqlite}  # sqlite or postgres
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-ollamamax}
      - POSTGRES_USER=${POSTGRES_USER:-ollama}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secure_password}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ollama_data:/app/data
      - ollama_logs:/app/logs
      - ollama_uploads:/app/uploads
      - ollama_models:/app/models
    networks:
      - ollama_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:13100/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Web Interface (served by API server, but can be separate)
  ollamamax-web:
    build: 
      context: .
      dockerfile: web.Dockerfile
    ports:
      - "8080:8080"   # Separate web server port
    environment:
      - API_BASE_URL=http://ollamamax-api:13100
      - WEB_PORT=8080
    depends_on:
      - ollamamax-api
    volumes:
      - ./web-interface:/app/web
    networks:
      - ollama_network
    restart: unless-stopped

  # PostgreSQL Database for Authentication and User Data
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-ollamamax}
      - POSTGRES_USER=${POSTGRES_USER:-ollama}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secure_password}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - ollama_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ollama} -d ${POSTGRES_DB:-ollamamax}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Session Management and Caching
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-ollama_redis_pass}
    volumes:
      - redis_data:/data
    networks:
      - ollama_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Nginx Reverse Proxy and Load Balancer
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"       # HTTP
      - "443:443"     # HTTPS
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - ollamamax-api
      - ollamamax-web
    networks:
      - ollama_network
    restart: unless-stopped

  # Email Service (MailCatcher for development/testing)
  mailcatcher:
    image: sj26/mailcatcher:latest
    ports:
      - "1080:1080"   # Web interface
      - "1025:1025"   # SMTP
    networks:
      - ollama_network
    restart: unless-stopped

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
      - '--web.listen-address=0.0.0.0:9090'
    networks:
      - ollama_network
    restart: unless-stopped

  # Grafana Analytics Dashboard
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"   # Changed to avoid conflict with web interface
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin_password}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - ollama_network
    restart: unless-stopped

  # Ollama Primary Node
  ollama-primary:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - ollama_network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Ollama Worker Node 1
  ollama-worker-1:
    image: ollama/ollama:latest
    ports:
      - "11435:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    volumes:
      - ollama_models_worker1:/root/.ollama
    networks:
      - ollama_network
    restart: unless-stopped

  # Ollama Worker Node 2
  ollama-worker-2:
    image: ollama/ollama:latest
    ports:
      - "11436:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    volumes:
      - ollama_models_worker2:/root/.ollama
    networks:
      - ollama_network
    restart: unless-stopped

volumes:
  # Application Data
  ollama_data:
    driver: local
  ollama_logs:
    driver: local
  ollama_uploads:
    driver: local
  ollama_models:
    driver: local
  ollama_models_worker1:
    driver: local
  ollama_models_worker2:
    driver: local
  
  # Database Data
  postgres_data:
    driver: local
  redis_data:
    driver: local
  
  # Monitoring Data
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  
  # Logs
  nginx_logs:
    driver: local

networks:
  ollama_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16