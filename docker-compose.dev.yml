version: '3.8'

services:
  # OllamaMax API Server - Development Configuration
  ollamamax-api:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "13100:13100"
      - "9229:9229"  # Node.js debug port
    environment:
      - NODE_ENV=development
      - PORT=13100
      - API_PORT=13100
      - WEB_PORT=3000
      - JWT_SECRET=dev_jwt_secret_not_for_production
      - SQLITE_DB_PATH=/app/data/users.db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=dev_redis_password
      - SMTP_HOST=localhost
      - SMTP_PORT=1025
      - SMTP_USER=dev@example.com
      - SMTP_PASSWORD=dev_password
      - SMTP_FROM=dev@example.com
      - DB_TYPE=sqlite
      - DEBUG_MODE=true
      - VERBOSE_LOGGING=true
      - ENABLE_SWAGGER=true
    depends_on:
      - redis
      - mailcatcher
    volumes:
      - ollama_data:/app/data
      - ollama_logs:/app/logs
      - ollama_uploads:/app/uploads
      - ollama_models:/app/models
      - ./api-server:/app/api-server  # Live reload
      - ./web-interface:/app/web-interface  # Live reload
    networks:
      - ollama_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:13100/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: ["node", "--inspect=0.0.0.0:9229", "server.js"]

  # Web Interface - Development
  ollamamax-web:
    build: 
      context: .
      dockerfile: web.Dockerfile
    ports:
      - "8080:8080"
    environment:
      - API_BASE_URL=http://localhost:13100
      - WEB_PORT=8080
      - NODE_ENV=development
    depends_on:
      - ollamamax-api
    volumes:
      - ./web-interface:/app/web  # Live reload
    networks:
      - ollama_network
    restart: unless-stopped

  # Redis Cache - Development
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass dev_redis_password
    volumes:
      - redis_data:/data
    networks:
      - ollama_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # MailCatcher for email testing
  mailcatcher:
    image: sj26/mailcatcher:latest
    ports:
      - "1080:1080"   # Web interface
      - "1025:1025"   # SMTP
    networks:
      - ollama_network
    restart: unless-stopped

  # Ollama Primary Node - Development
  ollama-primary:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
      - OLLAMA_DEBUG=1
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - ollama_network
    restart: unless-stopped

  # Optional development tools
  # Uncomment these services as needed for development

  # Database Admin Tool
  # adminer:
  #   image: adminer:latest
  #   ports:
  #     - "8081:8080"
  #   networks:
  #     - ollama_network
  #   restart: unless-stopped

  # Redis Admin Tool
  # redis-commander:
  #   image: rediscommander/redis-commander:latest
  #   ports:
  #     - "8082:8081"
  #   environment:
  #     - REDIS_HOSTS=local:redis:6379:0:dev_redis_password
  #   networks:
  #     - ollama_network
  #   restart: unless-stopped
  #   depends_on:
  #     - redis

volumes:
  ollama_data:
    driver: local
  ollama_logs:
    driver: local
  ollama_uploads:
    driver: local
  ollama_models:
    driver: local
  redis_data:
    driver: local

networks:
  ollama_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.21.0.0/16