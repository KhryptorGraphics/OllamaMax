global:
  resolve_timeout: 5m
  smtp_smarthost: '${SMTP_HOST}:${SMTP_PORT}'
  smtp_from: '${ALERT_EMAIL_FROM}'
  smtp_auth_username: '${SMTP_USER}'
  smtp_auth_password: '${SMTP_PASSWORD}'
  slack_api_url: '${SLACK_WEBHOOK_URL}'

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default'
  routes:
    # Critical alerts go to PagerDuty, Slack, and Email
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: false

    # Warning alerts go to Slack and Email only
    - match:
        severity: warning
      receiver: 'warning-alerts'
      continue: false

    # P2P component alerts go to dedicated channel
    - match:
        component: p2p
      receiver: 'p2p-alerts'
      continue: false

receivers:
  - name: 'default'
    slack_configs:
      - channel: '${SLACK_CHANNEL_WARNING}'
        title: 'OllamaMax Alert'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ end }}'

  - name: 'critical-alerts'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_SERVICE_KEY}'
        description: '{{ .CommonAnnotations.summary }}'
        severity: 'critical'
        details:
          firing: '{{ .Alerts.Firing | len }}'
          resolved: '{{ .Alerts.Resolved | len }}'
    slack_configs:
      - channel: '${SLACK_CHANNEL_CRITICAL}'
        title: ':rotating_light: CRITICAL ALERT'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ end }}'
        color: 'danger'
    email_configs:
      - to: '${ALERT_EMAIL_CRITICAL}'
        headers:
          Subject: '[CRITICAL] OllamaMax Alert: {{ .CommonAnnotations.summary }}'

  - name: 'warning-alerts'
    slack_configs:
      - channel: '${SLACK_CHANNEL_WARNING}'
        title: ':warning: Warning Alert'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ end }}'
        color: 'warning'
    email_configs:
      - to: '${ALERT_EMAIL_WARNING}'
        headers:
          Subject: '[WARNING] OllamaMax Alert: {{ .CommonAnnotations.summary }}'

  - name: 'p2p-alerts'
    slack_configs:
      - channel: '${SLACK_CHANNEL_P2P}'
        title: ':globe_with_meridians: P2P Network Alert'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ end }}'
    email_configs:
      - to: '${ALERT_EMAIL_P2P}'
        headers:
          Subject: '[P2P] OllamaMax Network Alert: {{ .CommonAnnotations.summary }}'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']
