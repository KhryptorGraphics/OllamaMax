groups:
- name: ollamamax-api
  rules:

  # API Performance Alerts
  - alert: APIHighLatency
    expr: http_request_duration_seconds{quantile="0.95"} > 1.0
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "API latency is high"
      description: "95th percentile API latency is {{ $value }}s (threshold: 1.0s)"

  - alert: APIHighErrorRate
    expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "API error rate is high"
      description: "API 5xx error rate is {{ $value }} (threshold: 0.05)"

- name: ollamamax-database
  rules:

  # Database Performance Alerts
  - alert: DatabasePoolExhausted
    expr: db_connections_in_use / db_connections_open > 0.9
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "Database connection pool nearly exhausted"
      description: "{{ $value | humanizePercentage }} of database connections in use (threshold: 90%)"

  - alert: DatabaseCacheHitRateLow
    expr: rate(cache_hits_total[5m]) / (rate(cache_hits_total[5m]) + rate(cache_misses_total[5m])) < 0.7
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "Database cache hit rate is low"
      description: "Cache hit rate is {{ $value | humanizePercentage }} (threshold: 70%)"

  - alert: PostgresConnectionsHigh
    expr: postgres_connections_active / postgres_connections_max > 0.8
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: "High PostgreSQL connection usage"
      description: "{{ $value | humanizePercentage }} of max connections in use (threshold: 80%)"

- name: ollamamax-p2p
  rules:

  # P2P Network Alerts
  - alert: P2PPeerCountLow
    expr: p2p_connected_peers < 3
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "P2P peer count is low"
      description: "Only {{ $value }} peers connected (threshold: 3)"

  - alert: P2PHighLatency
    expr: p2p_message_latency_seconds{quantile="0.95"} > 0.5
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "P2P message latency is high"
      description: "95th percentile P2P latency is {{ $value }}s (threshold: 0.5s)"

- name: ollamamax-loadbalancer
  rules:

  # Load Balancer Alerts
  - alert: LoadBalancerImbalance
    expr: stddev(lb_node_utilization) > 0.3
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "Load balancer has uneven distribution"
      description: "Load standard deviation is {{ $value }} (threshold: 0.3)"

  - alert: LoadBalancerUnhealthyUpstreams
    expr: nginx_upstream_servers{state!="up"} > 0
    for: 30s
    labels:
      severity: critical
    annotations:
      summary: "Load balancer has unhealthy upstreams"
      description: "{{ $value }} upstream servers are unhealthy"

- name: ollamamax-system
  rules:

  # Service Health Alerts
  - alert: ServiceDown
    expr: up == 0
    for: 30s
    labels:
      severity: critical
    annotations:
      summary: "Service is down"
      description: "{{ $labels.job }} service is down on {{ $labels.instance }}"

  - alert: HighCPUUsage
    expr: (100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 80
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: "High CPU usage"
      description: "CPU usage is {{ $value }}% on {{ $labels.instance }} (threshold: 80%)"

  - alert: HighMemoryUsage
    expr: (node_memory_used / node_memory_total) * 100 > 90
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "High memory usage on node"
      description: "Memory usage is {{ $value }}% on {{ $labels.instance }} (threshold: 90%)"
