input {
  beats {
    port => 5044
    codec => json
  }
}

filter {
  # Parse JSON log messages
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
      target => "log"
    }
  }

  # Extract timestamp
  if [log][timestamp] {
    date {
      match => ["[log][timestamp]", "ISO8601"]
      target => "@timestamp"
    }
  }

  # Extract log level
  if [log][level] {
    mutate {
      add_field => { "level" => "%{[log][level]}" }
      lowercase => ["level"]
    }
  }

  # Extract trace/span IDs for distributed tracing correlation
  if [log][trace_id] {
    mutate {
      add_field => { "trace_id" => "%{[log][trace_id]}" }
    }
  }

  if [log][span_id] {
    mutate {
      add_field => { "span_id" => "%{[log][span_id]}" }
    }
  }

  # Tag errors for easy filtering
  if [level] == "error" or [level] == "fatal" {
    mutate {
      add_tag => ["error"]
    }
  }

  # Tag audit logs
  if [log][audit] == true or [log][event_type] == "audit" {
    mutate {
      add_tag => ["audit"]
      add_field => { "index_prefix" => "ollamamax-audit" }
    }
  } else {
    mutate {
      add_field => { "index_prefix" => "ollamamax-logs" }
    }
  }

  # Add Kubernetes metadata if present
  if [kubernetes] {
    mutate {
      add_field => {
        "k8s_namespace" => "%{[kubernetes][namespace]}"
        "k8s_pod" => "%{[kubernetes][pod][name]}"
        "k8s_container" => "%{[kubernetes][container][name]}"
      }
    }
  }

  # Remove processed fields to reduce storage
  mutate {
    remove_field => ["log", "message"]
  }
}

output {
  # Route to appropriate index based on log type
  if "audit" in [tags] {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_HOST:elasticsearch}:${ELASTICSEARCH_PORT:9200}"]
      index => "ollamamax-audit-%{+YYYY.MM.dd}"
      document_type => "_doc"
    }
  } else if "error" in [tags] {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_HOST:elasticsearch}:${ELASTICSEARCH_PORT:9200}"]
      index => "ollamamax-errors-%{+YYYY.MM.dd}"
      document_type => "_doc"
    }
  } else {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_HOST:elasticsearch}:${ELASTICSEARCH_PORT:9200}"]
      index => "ollamamax-logs-%{+YYYY.MM.dd}"
      document_type => "_doc"
    }
  }

  # Debug output (disable in production)
  # stdout { codec => rubydebug }
}
