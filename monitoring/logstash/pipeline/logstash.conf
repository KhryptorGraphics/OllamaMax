input {
  beats {
    port => 5044
    codec => json
  }
}

filter {
  # Parse JSON if not already parsed
  if [message] =~ /^\{/ {
    json {
      source => "message"
      target => "parsed"
    }
  }

  # Extract Kubernetes metadata
  if [kubernetes] {
    mutate {
      add_field => {
        "[metadata][namespace]" => "%{[kubernetes][namespace]}"
        "[metadata][pod]" => "%{[kubernetes][pod][name]}"
        "[metadata][container]" => "%{[kubernetes][container][name]}"
      }
    }
  }

  # Parse timestamp
  date {
    match => ["timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss"]
    target => "@timestamp"
  }

  # Add component tags
  if [service] == "ollamamax-api" {
    mutate { add_tag => ["api"] }
  } else if [service] == "ollamamax-db" {
    mutate { add_tag => ["database"] }
  }

  # Extract trace_id and span_id for correlation
  if [trace_id] {
    mutate {
      add_field => { "traceId" => "%{trace_id}" }
    }
  }

  # Parse log levels
  if [level] {
    mutate {
      lowercase => [ "level" ]
    }
  }

  # Extract error details
  if [level] == "error" or [level] == "fatal" {
    mutate { add_tag => ["error"] }
    if [error] {
      mutate {
        add_field => {
          "[error_details][message]" => "%{[error][message]}"
          "[error_details][stack]" => "%{[error][stack]}"
        }
      }
    }
  }

  # Performance metrics extraction
  if [duration] {
    mutate {
      convert => { "duration" => "float" }
    }
  }

  if [response_time] {
    mutate {
      convert => { "response_time" => "float" }
    }
  }

  # HTTP request details
  if [http] {
    mutate {
      add_field => {
        "[http_details][method]" => "%{[http][method]}"
        "[http_details][path]" => "%{[http][path]}"
        "[http_details][status]" => "%{[http][status_code]}"
      }
    }
  }

  # Database query logging
  if [query] {
    mutate { add_tag => ["database_query"] }
    if [query_time] {
      mutate {
        convert => { "query_time" => "float" }
      }
    }
  }

  # Add environment information
  if [env] {
    mutate {
      add_field => { "environment" => "%{env}" }
    }
  } else {
    mutate {
      add_field => { "environment" => "production" }
    }
  }

  # Add geographic information if available
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "geoip"
    }
  }

  # Security event detection
  if [event_type] == "security" or [security] {
    mutate { add_tag => ["security"] }
  }

  # Rate limiting events
  if [rate_limit] {
    mutate { add_tag => ["rate_limit"] }
  }

  # Cache hit/miss tracking
  if [cache_status] {
    mutate { add_tag => ["cache"] }
  }

  # Remove sensitive data
  mutate {
    remove_field => ["password", "token", "api_key", "secret"]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "ollamamax-logs-%{+YYYY.MM.dd}"
    codec => json
    template_name => "ollamamax"
    template_overwrite => true
  }

  # Error logs to separate index
  if "error" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "ollamamax-errors-%{+YYYY.MM.dd}"
      codec => json
    }
  }

  # Security logs to separate index
  if "security" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "ollamamax-security-%{+YYYY.MM.dd}"
      codec => json
    }
  }

  # Performance metrics to separate index
  if [duration] or [response_time] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "ollamamax-performance-%{+YYYY.MM.dd}"
      codec => json
    }
  }

  # Debug output for development
  if [environment] == "development" {
    stdout {
      codec => rubydebug
    }
  }
}
