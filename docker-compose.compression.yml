# Docker Compose configuration with Brotli compression support
# Implements ISSUE-008 resolution: HTTP compression with Brotli + Gzip

version: '3.8'

services:
  # Nginx with Brotli compression support
  nginx-compression:
    image: fholzer/nginx-brotli:v1.24.0
    container_name: ollama-nginx-compression
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx-compression.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - api-server
    networks:
      - ollama-network
    environment:
      - NGINX_WORKER_PROCESSES=auto
      - NGINX_WORKER_CONNECTIONS=4096
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ollama.rule=Host(`ollamamax.local`)"
      - "traefik.http.services.ollama.loadbalancer.server.port=80"

  # API Server with compression middleware
  api-server:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ollama-api-compression
    ports:
      - "13100:13100"
    environment:
      - NODE_ENV=production
      - PORT=13100
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=ollama_redis_pass
      - MAX_JSON_SIZE=10mb
      - MAX_URLENCODED_SIZE=10mb
      - MAX_WS_MESSAGE_SIZE=1048576  # 1MB
      - MAX_HTTP_BODY_SIZE=10485760  # 10MB
      - MAX_PROMPT_SIZE=102400       # 100KB
    volumes:
      - ./api-server:/app/api-server:ro
      - ./src:/app/src:ro
      - api-logs:/app/logs
    depends_on:
      - redis
      - postgres
    networks:
      - ollama-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:13100/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: ollama-redis-compression
    command: redis-server --requirepass ollama_redis_pass --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - ollama-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # PostgreSQL with optimized connection pool
  postgres:
    image: postgres:15-alpine
    container_name: ollama-postgres-compression
    environment:
      - POSTGRES_DB=ollamamax
      - POSTGRES_USER=ollama_user
      - POSTGRES_PASSWORD=ollama_db_pass
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    networks:
      - ollama-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ollama_user -d ollamamax"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: ollama-prometheus-compression
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - ollama-network
    restart: unless-stopped

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: ollama-grafana-compression
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - ollama-network
    restart: unless-stopped

networks:
  ollama-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  nginx-logs:
    driver: local
  api-logs:
    driver: local
