---
# A/B Testing Framework Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ab-testing-framework
  namespace: ollamamax-ml
  labels:
    app: ab-testing-framework
    component: ml-pipeline
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ab-testing-framework
  template:
    metadata:
      labels:
        app: ab-testing-framework
    spec:
      containers:
      - name: ab-testing-framework
        image: node:18-alpine
        ports:
        - containerPort: 8083
        env:
        - name: REDIS_NODE_1
          value: "redis-cluster-0.redis-cluster-service.ollamamax-redis"
        - name: REDIS_NODE_2
          value: "redis-cluster-1.redis-cluster-service.ollamamax-redis"
        - name: REDIS_NODE_3
          value: "redis-cluster-2.redis-cluster-service.ollamamax-redis"
        - name: REDIS_PASSWORD
          value: "ollama_redis_pass"
        - name: TEST_DURATION
          value: "604800000" # 7 days
        - name: MIN_SAMPLE_SIZE
          value: "200"
        - name: SIGNIFICANCE_LEVEL
          value: "0.05"
        command: ["/bin/sh"]
        args:
        - -c
        - |
          cd /app
          npm install ioredis express cors
          # Create simple HTTP server for A/B testing
          cat > server.js << 'EOF'
          const ABTestingFramework = require('./src/ml/ab-testing-framework');
          const express = require('express');
          const cors = require('cors');
          
          const app = express();
          app.use(cors());
          app.use(express.json());
          
          const framework = new ABTestingFramework();
          
          app.get('/health', (req, res) => {
            res.json({ status: 'healthy', timestamp: Date.now() });
          });
          
          app.get('/tests', async (req, res) => {
            try {
              const tests = await framework.getActiveTests();
              res.json(tests);
            } catch (error) {
              res.status(500).json({ error: error.message });
            }
          });
          
          app.post('/assign/:testId', async (req, res) => {
            try {
              const { testId } = req.params;
              const { taskId, userId } = req.body;
              const assignment = await framework.assignVariant(testId, taskId, userId);
              res.json(assignment);
            } catch (error) {
              res.status(500).json({ error: error.message });
            }
          });
          
          app.post('/results/:testId', async (req, res) => {
            try {
              const { testId } = req.params;
              const { taskId, metrics } = req.body;
              await framework.recordResult(testId, taskId, metrics);
              res.json({ success: true });
            } catch (error) {
              res.status(500).json({ error: error.message });
            }
          });
          
          const port = process.env.AB_PORT || 8083;
          app.listen(port, () => {
            console.log(`A/B Testing API listening on port ${port}`);
          });
          EOF
          node server.js
        volumeMounts:
        - name: app-code
          mountPath: /app
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8083
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8083
          initialDelaySeconds: 15
          periodSeconds: 10
      volumes:
      - name: app-code
        configMap:
          name: ml-pipeline-code

---
# Feature Store Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feature-store
  namespace: ollamamax-ml
  labels:
    app: feature-store
    component: ml-pipeline
spec:
  replicas: 2
  selector:
    matchLabels:
      app: feature-store
  template:
    metadata:
      labels:
        app: feature-store
    spec:
      containers:
      - name: feature-store
        image: node:18-alpine
        ports:
        - containerPort: 8084
        env:
        - name: REDIS_NODE_1
          value: "redis-cluster-0.redis-cluster-service.ollamamax-redis"
        - name: REDIS_NODE_2
          value: "redis-cluster-1.redis-cluster-service.ollamamax-redis"
        - name: REDIS_NODE_3
          value: "redis-cluster-2.redis-cluster-service.ollamamax-redis"
        - name: REDIS_PASSWORD
          value: "ollama_redis_pass"
        - name: FEATURE_TTL
          value: "86400" # 24 hours
        - name: BATCH_UPDATE_INTERVAL
          value: "300000" # 5 minutes
        command: ["/bin/sh"]
        args:
        - -c
        - |
          cd /app
          npm install ioredis express cors
          # Create Feature Store API server
          cat > server.js << 'EOF'
          const FeatureStore = require('./src/ml/feature-store');
          const express = require('express');
          const cors = require('cors');
          
          const app = express();
          app.use(cors());
          app.use(express.json());
          
          const featureStore = new FeatureStore();
          
          app.get('/health', (req, res) => {
            res.json({ status: 'healthy', timestamp: Date.now() });
          });
          
          app.get('/features/:featureName/:entityId', async (req, res) => {
            try {
              const { featureName, entityId } = req.params;
              const context = req.query;
              const feature = await featureStore.computeFeature(featureName, entityId, context);
              res.json(feature);
            } catch (error) {
              res.status(500).json({ error: error.message });
            }
          });
          
          app.get('/feature-groups/:groupName/:entityId', async (req, res) => {
            try {
              const { groupName, entityId } = req.params;
              const context = req.query;
              const features = await featureStore.getFeatureGroup(groupName, entityId, context);
              res.json(features);
            } catch (error) {
              res.status(500).json({ error: error.message });
            }
          });
          
          app.get('/stats', async (req, res) => {
            try {
              const stats = await featureStore.getFeatureStats();
              res.json(stats);
            } catch (error) {
              res.status(500).json({ error: error.message });
            }
          });
          
          const port = process.env.FEATURE_PORT || 8084;
          app.listen(port, () => {
            console.log(`Feature Store API listening on port ${port}`);
          });
          EOF
          node server.js
        volumeMounts:
        - name: app-code
          mountPath: /app
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8084
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8084
          initialDelaySeconds: 15
          periodSeconds: 10
      volumes:
      - name: app-code
        configMap:
          name: ml-pipeline-code

