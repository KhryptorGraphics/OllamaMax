  selector:
    matchLabels:
      app: unified-neural-orchestrator
  template:
    metadata:
      labels:
        app: unified-neural-orchestrator
        component: ml-pipeline
    spec:
      containers:
      - name: unified-neural-orchestrator
        image: node:18-alpine
        ports:
        - containerPort: 8090
        env:
        - name: REDIS_NODES
          value: '[{"host":"redis-cluster-0.redis-cluster-service.ollamamax-redis","port":6379},{"host":"redis-cluster-1.redis-cluster-service.ollamamax-redis","port":6379},{"host":"redis-cluster-2.redis-cluster-service.ollamamax-redis","port":6379}]'
        - name: REDIS_PASSWORD
          value: "ollama_redis_pass"
        - name: ORCHESTRATOR_PORT
          value: "8090"
        command: ["/bin/sh"]
        args:
        - -c
        - |
          cd /app
          npm install ioredis @tensorflow/tfjs-node ml-random-forest express cors
          node src/agents/unified-neural-orchestrator.js
        volumeMounts:
        - name: app-code
          mountPath: /app
        resources:
          requests:
            memory: "2Gi"
            cpu: "1"
          limits:
            memory: "4Gi"
            cpu: "2"
        livenessProbe:
          exec:
            command: ["node", "-e", "process.exit(0)"]
          initialDelaySeconds: 120
          periodSeconds: 60
        readinessProbe:
          exec:
            command: ["node", "-e", "process.exit(0)"]
          initialDelaySeconds: 60
          periodSeconds: 30
      volumes:
      - name: app-code
        configMap:
          name: ml-pipeline-code

