apiVersion: v1
kind: Namespace
metadata:
  name: ollamamax-ml
  labels:
    name: ollamamax-ml

---
# Agent Selection Model Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-selection-model
  namespace: ollamamax-ml
  labels:
    app: agent-selection-model
    component: ml-pipeline
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent-selection-model
  template:
    metadata:
      labels:
        app: agent-selection-model
    spec:
      containers:
      - name: agent-selection-model
        image: node:18-alpine
        ports:
        - containerPort: 8081
        env:
        - name: REDIS_NODE_1
          value: "redis-cluster-0.redis-cluster-service.ollamamax-redis"
        - name: REDIS_NODE_2
          value: "redis-cluster-1.redis-cluster-service.ollamamax-redis"
        - name: REDIS_NODE_3
          value: "redis-cluster-2.redis-cluster-service.ollamamax-redis"
        - name: REDIS_PASSWORD
          value: "ollama_redis_pass"
        - name: MODEL_PORT
          value: "8081"
        - name: N_ESTIMATORS
          value: "200"
        - name: MAX_DEPTH
          value: "15"
        command: ["/bin/sh"]
        args:
        - -c
        - |
          cd /app
          npm install ioredis express cors ml-random-forest
          node src/ml/agent-selection-model.js
        volumeMounts:
        - name: app-code
          mountPath: /app
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1"
        livenessProbe:
          exec:
            command: ["node", "-e", "process.exit(0)"]
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          exec:
            command: ["node", "-e", "process.exit(0)"]
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: app-code
        configMap:
          name: ml-pipeline-code

