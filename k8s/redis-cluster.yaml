apiVersion: v1
kind: Namespace
metadata:
  name: ollamamax-redis
  labels:
    name: ollamamax-redis
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-cluster-config
  namespace: ollamamax-redis
data:
  redis.conf: |
    # Redis Cluster Configuration for OllamaMax Agent System
    port 6379
    cluster-enabled yes
    cluster-config-file /data/nodes.conf
    cluster-node-timeout 5000
    cluster-announce-ip ${POD_IP}
    cluster-announce-port 6379
    cluster-announce-bus-port 16379
    
    # Memory and Performance Settings
    maxmemory 4gb
    maxmemory-policy allkeys-lru
    maxmemory-samples 10
    
    # Persistence Configuration
    save 900 1
    save 300 10
    save 60 10000
    appendonly yes
    appendfsync everysec
    auto-aof-rewrite-percentage 100
    auto-aof-rewrite-min-size 64mb
    
    # Network and Security
    bind 0.0.0.0
    protected-mode no
    tcp-keepalive 300
    timeout 0
    
    # Logging
    loglevel notice
    logfile ""
    
    # Performance Tuning
    tcp-backlog 511
    databases 16
    hz 10
    
    # Client Management
    timeout 0
    tcp-keepalive 300
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cluster
  namespace: ollamamax-redis
  labels:
    app: redis-cluster
spec:
  ports:
  - port: 6379
    targetPort: 6379
    name: client
  - port: 16379
    targetPort: 16379
    name: gossip
  clusterIP: None
  selector:
    app: redis-cluster
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-cluster
  namespace: ollamamax-redis
spec:
  serviceName: redis-cluster
  replicas: 6
  selector:
    matchLabels:
      app: redis-cluster
  template:
    metadata:
      labels:
        app: redis-cluster
    spec:
      containers:
      - name: redis
        image: redis:7.2-alpine
        ports:
        - containerPort: 6379
          name: client
        - containerPort: 16379
          name: gossip
        command: ["redis-server"]
        args: ["/etc/redis/redis.conf"]
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        volumeMounts:
        - name: conf
          mountPath: /etc/redis
          readOnly: false
        - name: data
          mountPath: /data
          readOnly: false
        resources:
          requests:
            memory: "4Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 30
          timeoutSeconds: 5
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          timeoutSeconds: 1
          periodSeconds: 5
          successThreshold: 1
          failureThreshold: 3
      volumes:
      - name: conf
        configMap:
          name: redis-cluster-config
          defaultMode: 0755
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 20Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: redis-cluster-init
  namespace: ollamamax-redis
spec:
  template:
    spec:
      containers:
      - name: redis-cluster-init
        image: redis:7.2-alpine
        command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "Waiting for Redis nodes to be ready..."
          sleep 30
          
          # Get all Redis pod IPs
          REDIS_NODES=""
          for i in $(seq 0 5); do
            POD_IP=$(nslookup redis-cluster-${i}.redis-cluster.ollamamax-redis.svc.cluster.local | grep -E '^Address:' | tail -n1 | cut -d' ' -f2)
            if [ -n "$POD_IP" ]; then
              REDIS_NODES="$REDIS_NODES $POD_IP:6379"
            fi
          done
          
          echo "Redis nodes: $REDIS_NODES"
          
          # Create cluster
          echo "yes" | redis-cli --cluster create $REDIS_NODES --cluster-replicas 1
          
          echo "Redis cluster initialization completed successfully"
          
          # Wait and verify cluster status
          sleep 10
          redis-cli --cluster check $(echo $REDIS_NODES | awk '{print $1}')
      restartPolicy: OnFailure
  backoffLimit: 3
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cluster-lb
  namespace: ollamamax-redis
  labels:
    app: redis-cluster
spec:
  type: LoadBalancer
  ports:
  - port: 6379
    targetPort: 6379
    name: redis
  selector:
    app: redis-cluster