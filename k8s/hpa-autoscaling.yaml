---
# Horizontal Pod Autoscaler Configurations for OllamaMax
# References: k8s/ml-pipeline.yaml, production-performance.yaml, multi-region-deployment.yaml

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ollamamax-api-hpa
  namespace: ollamamax-multiregion
  annotations:
    description: "HPA for multi-region API deployment (ollamamax-api-multiregion)"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ollamamax-api-multiregion
  minReplicas: 3
  maxReplicas: 10
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Pods
        value: 2
        periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: swarm-worker-hpa
  namespace: ollamamax-ml
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: swarm-worker
  minReplicas: 2
  maxReplicas: 20
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Pods
        value: 4
        periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
      - type: Pods
        value: 2
        periodSeconds: 60
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 85
  # TODO: Enable custom metrics after Prometheus Adapter is deployed and verified
  # Requires: kubectl apply -f k8s/prometheus-adapter.yaml
  # Verify with: kubectl get --raw "/apis/custom.metrics.k8s.io/v1beta2" | jq
  # Then uncomment the following block:
  # - type: Pods
  #   pods:
  #     metric:
  #       name: agent_utilization
  #     target:
  #       type: AverageValue
  #       averageValue: "0.8"

