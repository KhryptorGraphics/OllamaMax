---
# Multi-Region Deployment Configuration for OllamaMax
# References: k8s/redis-cluster.yaml, production-performance.yaml

apiVersion: v1
kind: Namespace
metadata:
  name: ollamamax-multiregion
  labels:
    topology.kubernetes.io/region-aware: "true"

---
# Regional Redis Cluster with Cross-Region Replication
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-cluster-us-east
  namespace: ollamamax-multiregion
  labels:
    app: redis-cluster
    region: us-east-1
spec:
  serviceName: redis-cluster-us-east
  replicas: 3
  selector:
    matchLabels:
      app: redis-cluster
      region: us-east-1
  template:
    metadata:
      labels:
        app: redis-cluster
        region: us-east-1
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values:
                - us-east-1
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - redis-cluster
            topologyKey: kubernetes.io/hostname
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: client
        - containerPort: 16379
          name: gossip
        command:
        - redis-server
        args:
        - "--cluster-enabled yes"
        - "--cluster-config-file /data/nodes.conf"
        - "--cluster-node-timeout 5000"
        - "--appendonly yes"
        - "--protected-mode no"
        volumeMounts:
        - name: redis-data
          mountPath: /data
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
  volumeClaimTemplates:
  - metadata:
      name: redis-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-cluster-us-west
  namespace: ollamamax-multiregion
  labels:
