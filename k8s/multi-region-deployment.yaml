---
# Headless Services for StatefulSets
apiVersion: v1
kind: Service
metadata:
  name: redis-cluster-us-east
  namespace: ollamamax-multiregion
  labels:
    region: us-east-1
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
  - port: 6379
    name: client
  - port: 16379
    name: gossip
  selector:
    app: redis-cluster
    region: us-east-1

---
# LoadBalancer Service for External Access (us-east)
apiVersion: v1
kind: Service
metadata:
  name: redis-cluster-us-east-lb
  namespace: ollamamax-multiregion
  labels:
    region: us-east-1
spec:
  type: LoadBalancer
  ports:
  - port: 6379
    name: client
  - port: 16379
    name: gossip
  selector:
    app: redis-cluster
    region: us-east-1

