      region: us-west-2
  template:
    metadata:
      labels:
        app: redis-cluster
        region: us-west-2
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values:
                - us-west-2
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - redis-cluster
            topologyKey: kubernetes.io/hostname
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: client
        - containerPort: 16379
          name: gossip
        command:
        - redis-server
        args:
        - "--cluster-enabled yes"
        - "--cluster-config-file /data/nodes.conf"
        - "--cluster-node-timeout 5000"
        - "--appendonly yes"
        - "--protected-mode no"
        - "--replicaof redis-cluster-us-east-0.redis-cluster-us-east.ollamamax-multiregion.svc.cluster.local 6379"
        volumeMounts:
        - name: redis-data
          mountPath: /data
        resources:
          requests:
            cpu: 250m
