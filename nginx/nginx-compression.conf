# OllamaMax Nginx Configuration with Advanced Compression
# Implements Brotli + Gzip compression as per FUTURE_ENHANCEMENTS_ROADMAP.md Month 2

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Optimize worker connections
events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with compression info
    log_format compression '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $bytes_sent '
                          '"$http_referer" "$http_user_agent" '
                          'rt=$request_time uct="$upstream_connect_time" '
                          'uht="$upstream_header_time" urt="$upstream_response_time" '
                          'cs=$upstream_cache_status '
                          'ce="$sent_http_content_encoding" '
                          'cl="$sent_http_content_length"';

    access_log /var/log/nginx/access.log compression;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    # Buffer optimizations
    client_body_buffer_size 128k;
    client_max_body_size 10m;  # Match API server limit
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    output_buffers 1 32k;
    postpone_output 1460;

    # ============================================================================
    # GZIP COMPRESSION CONFIGURATION
    # ============================================================================
    # Primary compression method with broad browser support
    
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject;

    # ============================================================================
    # BROTLI COMPRESSION CONFIGURATION
    # ============================================================================
    # Advanced compression with 20-30% better compression than gzip
    # Requires nginx-module-brotli or custom build
    
    # Uncomment when using nginx image with Brotli support:
    # - fholzer/nginx-brotli:latest
    # - Custom build with ngx_brotli module
    
    # brotli on;
    # brotli_comp_level 6;
    # brotli_min_length 1024;
    # brotli_types
    #     text/plain
    #     text/css
    #     text/xml
    #     text/javascript
    #     application/json
    #     application/javascript
    #     application/xml+rss
    #     application/rss+xml
    #     application/atom+xml
    #     image/svg+xml
    #     font/truetype
    #     font/opentype
    #     application/vnd.ms-fontobject;

    # ============================================================================
    # UPSTREAM CONFIGURATION
    # ============================================================================
    
    upstream ollama_api {
        least_conn;
        server api-server:13100 weight=3 max_fails=2 fail_timeout=10s;
        server api-server:13101 weight=2 max_fails=2 fail_timeout=10s backup;
        keepalive 32;
        keepalive_requests 100;
        keepalive_timeout 60s;
    }

    # ============================================================================
    # MAIN SERVER CONFIGURATION
    # ============================================================================
    
    server {
        listen 80;
        server_name localhost ollamamax.local;
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Compression-Info "$sent_http_content_encoding" always;
        
        # Request size limits (matching API server)
        client_max_body_size 10m;
        
        # API endpoints with compression
        location /api/ {
            proxy_pass http://ollama_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # Compression settings for API responses
            proxy_set_header Accept-Encoding gzip;
            
            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Buffer settings
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }
        
        # WebSocket endpoint
        location /chat {
            proxy_pass http://ollama_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket specific settings
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        
        # Health check endpoint (no compression needed)
        location /health {
            proxy_pass http://ollama_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Fast health checks
            proxy_connect_timeout 1s;
            proxy_send_timeout 1s;
            proxy_read_timeout 1s;
        }
    }
}
