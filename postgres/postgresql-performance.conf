# PostgreSQL Performance Configuration for OllamaMax
# Optimized for high-throughput workloads (10K+ RPS)
# Addresses ISSUE-009: Database Connection Pool Too Small

# =============================================================================
# CONNECTION AND AUTHENTICATION
# =============================================================================

# Connection settings
listen_addresses = '*'
port = 5432
max_connections = 200                    # Increased for high load (was 100)
superuser_reserved_connections = 3

# Authentication
password_encryption = scram-sha-256
ssl = on
ssl_prefer_server_ciphers = on

# =============================================================================
# RESOURCE USAGE (MEMORY)
# =============================================================================

# Memory settings (adjust based on available RAM)
shared_buffers = 512MB                   # 25% of RAM for 2GB system
effective_cache_size = 1536MB            # 75% of RAM for 2GB system
work_mem = 4MB                          # Per-operation memory
maintenance_work_mem = 128MB             # Maintenance operations
max_stack_depth = 2MB

# Huge pages (if available)
huge_pages = try

# =============================================================================
# WRITE AHEAD LOG (WAL)
# =============================================================================

# WAL settings for performance and durability
wal_level = replica
wal_buffers = 16MB
max_wal_size = 2GB
min_wal_size = 512MB
wal_compression = on
wal_log_hints = on

# Checkpoints
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
checkpoint_warning = 30s

# Archive settings (for replication/backup)
archive_mode = on
archive_command = '/bin/true'            # Placeholder - configure for production

# =============================================================================
# QUERY TUNING
# =============================================================================

# Query planner settings
random_page_cost = 1.1                  # SSD-optimized (was 4.0)
effective_io_concurrency = 200          # SSD concurrent I/O
seq_page_cost = 1.0
cpu_tuple_cost = 0.01
cpu_index_tuple_cost = 0.005
cpu_operator_cost = 0.0025

# Query execution
default_statistics_target = 100         # Statistics sampling
constraint_exclusion = partition
cursor_tuple_fraction = 0.1
from_collapse_limit = 8
join_collapse_limit = 8

# =============================================================================
# LOGGING
# =============================================================================

# Logging configuration
logging_collector = on
log_destination = 'stderr'
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_truncate_on_rotation = on

# What to log
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 1000       # Log queries > 1 second
log_checkpoints = on
log_connections = off                    # Disable for high load
log_disconnections = off                 # Disable for high load
log_lock_waits = on
log_temp_files = 10MB
log_autovacuum_min_duration = 0
log_error_verbosity = default

# Statement logging
log_statement = 'none'                  # 'none', 'ddl', 'mod', 'all'
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

# =============================================================================
# AUTOVACUUM
# =============================================================================

# Autovacuum settings for high-write workloads
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 30s                # More frequent than default (1min)
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.1    # More aggressive than default (0.2)
autovacuum_analyze_threshold = 50
autovacuum_analyze_scale_factor = 0.05  # More aggressive than default (0.1)
autovacuum_vacuum_cost_delay = 10ms     # Faster vacuum
autovacuum_vacuum_cost_limit = 1000     # Higher cost limit

# =============================================================================
# CLIENT CONNECTION DEFAULTS
# =============================================================================

# Connection defaults
search_path = '"$user", public'
default_tablespace = ''
temp_tablespaces = ''
check_function_bodies = on
default_transaction_isolation = 'read committed'
default_transaction_read_only = off
default_transaction_deferrable = off
session_replication_role = 'origin'

# Statement timeout (prevent runaway queries)
statement_timeout = 60000               # 60 seconds
lock_timeout = 30000                    # 30 seconds
idle_in_transaction_session_timeout = 300000  # 5 minutes

# =============================================================================
# LOCK MANAGEMENT
# =============================================================================

# Lock settings
max_locks_per_transaction = 64
max_pred_locks_per_transaction = 64
max_pred_locks_per_relation = -2
max_pred_locks_per_page = 2

# Deadlock detection
deadlock_timeout = 1s

# =============================================================================
# ERROR REPORTING AND LOGGING
# =============================================================================

# Error handling
exit_on_error = off
restart_after_crash = on

# =============================================================================
# REPLICATION (if using streaming replication)
# =============================================================================

# Replication settings
max_wal_senders = 3
max_replication_slots = 3
wal_keep_size = 1GB
hot_standby = on
hot_standby_feedback = on
wal_receiver_timeout = 60s
wal_sender_timeout = 60s

# =============================================================================
# BACKGROUND WRITER
# =============================================================================

# Background writer settings
bgwriter_delay = 200ms
bgwriter_lru_maxpages = 100
bgwriter_lru_multiplier = 2.0
bgwriter_flush_after = 512kB

# =============================================================================
# ASYNCHRONOUS BEHAVIOR
# =============================================================================

# Asynchronous commit (trade durability for performance)
synchronous_commit = on                  # Keep 'on' for data safety
wal_writer_delay = 200ms
wal_writer_flush_after = 1MB

# =============================================================================
# STATISTICS
# =============================================================================

# Statistics collection
track_activities = on
track_counts = on
track_io_timing = on
track_functions = all
stats_temp_directory = 'pg_stat_tmp'

# =============================================================================
# CUSTOM SETTINGS FOR OLLAMAMAX
# =============================================================================

# Application-specific settings
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
pg_stat_statements.track_utility = on
pg_stat_statements.save = on

# Custom variables (can be used by application)
# custom.ollama_max_connections = 200
# custom.ollama_pool_size = 100
