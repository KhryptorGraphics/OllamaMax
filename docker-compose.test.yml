version: '3.8'

services:
  redis:
    image: redis:7-alpine
    deploy:
      replicas: 1
    networks:
      - test-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  postgres:
    image: postgres:15-alpine
    deploy:
      replicas: 1
    environment:
      POSTGRES_DB: ollamamax
      POSTGRES_USER: ollamamax
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    networks:
      - test-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ollamamax"]
      interval: 10s

  nginx:
    image: nginx:alpine
    deploy:
      replicas: 1
    ports:
      - "8080:80"
    networks:
      - test-net
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s

networks:
  test-net:
    driver: overlay
    attachable: true

secrets:
  postgres_password:
    external: true
