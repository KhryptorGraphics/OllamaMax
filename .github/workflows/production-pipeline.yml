name: Production Readiness Pipeline

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]

env:
  GO_VERSION: '1.23.x'
  NODE_VERSION: '20'

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build application
        run: |
          go build -o bin/ollamamax ./cmd/ollama-distributed

      - name: Start application for security scan
        run: |
          ./bin/ollamamax &
          APP_PID=$!
          echo $APP_PID > app.pid

          # Wait for app to be ready
          echo "Waiting for application to be ready..."
          MAX_ATTEMPTS=30
          for i in $(seq 1 $MAX_ATTEMPTS); do
            if curl -f http://localhost:8080/health > /dev/null 2>&1 || curl -f http://localhost:8080 > /dev/null 2>&1; then
              echo "✅ Application is ready (attempt $i/$MAX_ATTEMPTS)"
              break
            fi
            echo "Attempt $i/$MAX_ATTEMPTS: Application not ready yet..."
            sleep 2
            if [ $i -eq $MAX_ATTEMPTS ]; then
              echo "❌ Application failed to start within timeout"
              kill $APP_PID 2>/dev/null || true
              exit 1
            fi
          done

      - name: Run Snyk Security Scan
        uses: snyk/actions/golang@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'http://localhost:8080'

      - name: Stop application
        if: always()
        run: |
          if [ -f app.pid ]; then
            APP_PID=$(cat app.pid)
            kill $APP_PID 2>/dev/null || true
            rm -f app.pid
          else
            pkill -f "bin/ollamamax" || true
          fi

      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: security-report.json

  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: Install dependencies
        run: |
          go mod download
          npm ci
          
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.55.2
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          
      - name: Run linting
        run: |
          golangci-lint run
          npm run lint
          
      - name: Run Go tests with coverage
        run: |
          go test -v -coverprofile=coverage.out -covermode=atomic ./internal/... ./pkg/... ./cmd/...
          go tool cover -html=coverage.out -o coverage.html
          go tool cover -func=coverage.out

      - name: Validate Go coverage threshold (90%)
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | grep -Eo '[0-9]+\.[0-9]+')
          echo "Go Coverage: ${COVERAGE}%"
          if [ "$(awk "BEGIN {print ($COVERAGE < 90)}")" -eq 1 ]; then
            echo "❌ Go coverage ${COVERAGE}% is below threshold 90%"
            exit 1
          else
            echo "✅ Go coverage ${COVERAGE}% meets threshold 90%"
          fi

      - name: Run JavaScript tests with coverage
        run: npm run test:coverage

      - name: Validate JavaScript coverage threshold (90%)
        run: npm run validate:coverage
          
      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.out
            coverage.html

  performance-testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Start application
        run: |
          npm run build
          ./bin/ollamamax &
          sleep 10

      - name: Run performance tests
        run: |
          npm run test:performance
          npm run test:performance:stress

      - name: Run Jest performance benchmarks
        run: jest tests/performance-*.test.js --config=jest.config.cjs

      - name: Upload Performance Reports
        uses: actions/upload-artifact@v4
        with:
          name: performance-reports
          path: test-results/performance/

  browser-testing:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install Playwright
        run: npx playwright install --with-deps ${{ matrix.browser }}
        
      - name: Run browser tests
        run: npx playwright test --project=${{ matrix.browser }}
        
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results/

  load-testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
          
      - name: Start application
        run: |
          go build -o bin/ollamamax ./cmd/ollama-distributed
          ./bin/ollamamax &
          sleep 10
          
      - name: Run load tests
        run: |
          k6 run --vus 100 --duration 5m load-test.js
          
      - name: Upload load test results
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: load-test-report.json

  database-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ollamamax_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
          
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          
      - name: Run database migrations
        run: |
          go run . migrate
          
      - name: Run database tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ollamamax_test?sslmode=disable
          REDIS_URL: redis://localhost:6379
        run: |
          go test ./internal/database/... -v
          go test ./internal/cache/... -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build and test Docker image
        run: |
          docker build -t ollamamax:test .
          docker run --rm -d --name ollamamax-test -p 8080:8080 ollamamax:test
          sleep 10
          curl -f http://localhost:8080/health || exit 1
          docker stop ollamamax-test
          
  deployment-validation:
    needs: [security-scan, code-quality, performance-testing, browser-testing, load-testing, database-validation, docker-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment"
          # Add actual deployment commands here
          
      - name: Run smoke tests
        run: |
          echo "Running smoke tests"
          # Add smoke test commands here
          
      - name: Production deployment (manual approval)
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: admin
          minimum-approvals: 1
          issue-title: "Deploy to Production"
          
      - name: Deploy to production
        if: success()
        run: |
          echo "Deploying to production"
          # Add production deployment commands here

  monitoring-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup monitoring alerts
        run: |
          echo "Setting up monitoring and alerting"
          # Add monitoring setup commands here
